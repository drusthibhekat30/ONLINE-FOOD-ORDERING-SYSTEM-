<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Our table | Saffron & Stone')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="subpage contact-page"><section class="contact-copy"><p class="eyebrow">PULL UP A CHAIR</p><h1>We'd love to<br><em>hear from you.</em></h1><p>Questions about an order, a dish, or just want to say hello? Send us a note and our team will get back to you.</p><div class="contact-detail"><span>✳</span><div><small>OUR HOURS</small><b>Every day, 11am – 10pm</b></div></div><div class="contact-detail"><span>✳</span><div><small>THE NEIGHBORHOOD</small><b>Made with care, close to home</b></div></div></section><form class="form-panel contact-form" action="/contact" method="post"><p class="eyebrow">SEND A NOTE</p><h2>How can we help?</h2><p class="flash success" th:if="${notice != null}" th:text="${notice}"></p><p class="flash error" th:if="${error != null}" th:text="${error}"></p><label>Your name<input name="name" maxlength="120" required></label><label>Email address<input type="email" name="email" required></label><label>Your message<textarea name="message" rows="5" maxlength="1200" required></textarea></label><button class="button button-dark" type="submit">Send message <span>→</span></button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
