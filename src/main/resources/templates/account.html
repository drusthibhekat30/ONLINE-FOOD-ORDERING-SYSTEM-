<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Your account | Saffron & Stone')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="subpage account-page"><section class="account-art"><img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1200&q=85" alt="Dinner table set for a shared meal"><div><p class="eyebrow">A SEAT AT OUR TABLE</p><h1>Good to have<br><em>you here.</em></h1><p>Sign in to pick up where you left off, or join us for something delicious.</p></div></section><section class="account-forms"><div class="notice-wrap"><p class="flash error" th:if="${error != null}" th:text="${error}"></p></div><form class="form-panel" action="/account/login" method="post"><p class="eyebrow">WELCOME BACK</p><h2>Sign in</h2><label>Email address<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">Sign in <span>→</span></button></form><form class="form-panel register-panel" action="/account/register" method="post"><p class="eyebrow">NEW AROUND HERE?</p><h2>Make an account</h2><label>Your name<input name="name" autocomplete="name" minlength="2" maxlength="120" required></label><label>Email address<input type="email" name="email" autocomplete="email" required></label><label>Create password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required><small>At least 8 characters, with a letter and a number.</small></label><button class="button button-outline" type="submit">Create account <span>→</span></button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
