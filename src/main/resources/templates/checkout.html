<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Checkout | Saffron & Stone')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="subpage checkout-page"><div class="page-title"><p class="eyebrow">ONE LAST THING</p><h1>Let's get dinner <em>to you.</em></h1></div><div class="checkout-layout"><form action="/checkout/place" method="post" class="checkout-form"><div class="checkout-step"><span>01</span><div><h2>Delivery details</h2><label>Full delivery address<textarea name="address" rows="3" minlength="8" maxlength="500" placeholder="Street, apartment, city, postal code" required></textarea></label></div></div><div class="checkout-step"><span>02</span><div><h2>Payment method</h2><div class="payment-options"><label><input type="radio" name="paymentMode" value="COD" checked><span><b>Cash on delivery</b><small>Pay when dinner arrives</small></span></label><label><input type="radio" name="paymentMode" value="UPI"><span><b>UPI</b><small>Demo only, no payment collected</small></span></label></div></div></div><div class="checkout-step"><span>03</span><div><h2>Have a little extra?</h2><label>Coupon code<input name="coupon" placeholder="WELCOME10 or FEAST15" maxlength="40"></label></div></div><button class="button button-dark place-order" type="submit">Place order <span>→</span></button></form><aside class="bill-panel"><p class="eyebrow">THE DETAILS</p><h2>Your order</h2><div class="bill-items"><div th:each="line : ${lines}"><span th:text="|${line.quantity} × ${line.item.name}|">Dish</span><b th:text="|$${#numbers.formatDecimal(line.lineTotal(),1,2)}|">$0</b></div></div><div class="bill-total"><div><span>Subtotal</span><b th:text="|$${#numbers.formatDecimal(subtotal,1,2)}|">$0</b></div><div><span>Tax</span><b th:text="|$${#numbers.formatDecimal(tax,1,2)}|">$0</b></div><div><span>Delivery</span><b th:text="${deliveryFee.signum() == 0 ? 'FREE' : '$' + #numbers.formatDecimal(deliveryFee,1,2)}">$0</b></div><div class="grand-total"><span>Total</span><b th:text="|$${#numbers.formatDecimal(total,1,2)}|">$0</b></div></div><p class="tax-note">Includes applicable tax. Free delivery over $35.</p></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
