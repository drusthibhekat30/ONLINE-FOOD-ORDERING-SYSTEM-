<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Order history | Saffron & Stone')}"></head><body><div th:replace="~{fragments/header :: nav}"></div><main class="subpage orders-page"><div class="page-title"><p class="eyebrow">FROM OUR KITCHEN TO YOURS</p><h1>Your <em>orders.</em></h1><p>Every good meal has a story. Here's your recent one.</p></div><div class="orders-list" th:if="${!orders.isEmpty()}"><article class="order-card" th:each="order : ${orders}"><div class="order-head"><div><span class="order-number" th:text="|ORDER #${order.id}|">ORDER #01</span><p th:text="${#dates.format(order.created_at, 'MMM d, yyyy · h:mm a')}">Date</p></div><span class="status-pill" th:text="${order.status}">Placed</span></div><div class="order-info"><span th:text="${order.payment_mode == 'UPI' ? 'UPI · demo payment' : 'Cash on delivery'}">Payment</span><span th:text="|Delivery to ${order.delivery_address}|">Address</span><b th:text="|$${#numbers.formatDecimal(order.total,1,2)}|">$0.00</b></div><div class="order-progress"><span th:each="step,iter : ${ {'Placed','Preparing','Out for delivery','Delivered'} }" th:classappend="${ {'Placed','Preparing','Out for delivery','Delivered'}.indexOf(order.status) >= iter.index ? ' complete' : ''}"><i></i><small th:text="${step}">Placed</small></span></div></article></div><div class="empty-orders" th:if="${orders.isEmpty()}"><span>✳</span><h2>Your next favorite meal is waiting.</h2><a class="button button-dark" href="/#menu">Browse the menu <span>→</span></a></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
